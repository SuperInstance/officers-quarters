<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="800" height="500">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0a1929"/>
      <stop offset="100%" stop-color="#0d2540"/>
    </linearGradient>
  </defs>
  <rect width="800" height="500" fill="url(#bg)"/>

  <!-- Connection lines -->
  <g stroke="#3498db" stroke-width="1" opacity="0.3" fill="none">
    <line x1="400" y1="80" x2="200" y2="180"/>
    <line x1="400" y1="80" x2="600" y2="180"/>
    <line x1="400" y1="80" x2="400" y2="180"/>
    <line x1="200" y1="180" x2="100" y2="280"/>
    <line x1="200" y1="180" x2="300" y2="280"/>
    <line x1="400" y1="180" x2="300" y2="280"/>
    <line x1="400" y1="180" x2="500" y2="280"/>
    <line x1="600" y1="180" x2="500" y2="280"/>
    <line x1="600" y1="180" x2="700" y2="280"/>
    <line x1="100" y1="280" x2="200" y2="400"/>
    <line x1="300" y1="280" x2="200" y2="400"/>
    <line x1="300" y1="280" x2="400" y2="400"/>
    <line x1="500" y1="280" x2="400" y2="400"/>
    <line x1="500" y1="280" x2="600" y2="400"/>
    <line x1="700" y1="280" x2="600" y2="400"/>
  </g>

  <!-- Room nodes -->
  <!-- Bridge -->
  <circle cx="400" cy="80" r="35" fill="#1a5276" stroke="#3498db" stroke-width="2"/>
  <text x="400" y="76" text-anchor="middle" font-size="20">🛟</text>
  <text x="400" y="130" text-anchor="middle" font-family="monospace" font-size="11" fill="#e8e8e8">Bridge</text>

  <!-- Row 2 -->
  <circle cx="200" cy="180" r="30" fill="#1a5276" stroke="#3498db" stroke-width="2"/>
  <text x="200" y="186" text-anchor="middle" font-size="18">⚡</text>
  <text x="200" y="225" text-anchor="middle" font-family="monospace" font-size="10" fill="#e8e8e8">Flash</text>

  <circle cx="400" cy="180" r="30" fill="#1a5276" stroke="#3498db" stroke-width="2"/>
  <text x="400" y="186" text-anchor="middle" font-size="18">🧠</text>
  <text x="400" y="225" text-anchor="middle" font-family="monospace" font-size="10" fill="#e8e8e8">Pro</text>

  <circle cx="600" cy="180" r="30" fill="#1a5276" stroke="#3498db" stroke-width="2"/>
  <text x="600" y="186" text-anchor="middle" font-size="18">🌟</text>
  <text x="600" y="225" text-anchor="middle" font-family="monospace" font-size="10" fill="#e8e8e8">Wesley</text>

  <!-- Row 3 -->
  <circle cx="100" cy="280" r="28" fill="#0d2540" stroke="#3498db" stroke-width="1.5"/>
  <text x="100" y="285" text-anchor="middle" font-size="16">✍️</text>
  <text x="100" y="320" text-anchor="middle" font-family="monospace" font-size="9" fill="#e8e8e8">Scribe</text>

  <circle cx="300" cy="280" r="28" fill="#0d2540" stroke="#3498db" stroke-width="1.5"/>
  <text x="300" y="285" text-anchor="middle" font-size="16">📡</text>
  <text x="300" y="320" text-anchor="middle" font-family="monospace" font-size="9" fill="#e8e8e8">Hermes</text>

  <circle cx="500" cy="280" r="28" fill="#1a5276" stroke="#e94560" stroke-width="2"/>
  <text x="500" y="285" text-anchor="middle" font-size="16">🃏</text>
  <text x="500" y="320" text-anchor="middle" font-family="monospace" font-size="9" fill="#e8e8e8">Poker</text>

  <circle cx="700" cy="280" r="28" fill="#0d2540" stroke="#3498db" stroke-width="1.5"/>
  <text x="700" y="285" text-anchor="middle" font-size="16">📚</text>
  <text x="700" y="320" text-anchor="middle" font-family="monospace" font-size="9" fill="#e8e8e8">Library</text>

  <!-- Row 4 -->
  <circle cx="200" cy="400" r="28" fill="#0d2540" stroke="#3498db" stroke-width="1.5"/>
  <text x="200" y="405" text-anchor="middle" font-size="16">🔧</text>
  <text x="200" y="440" text-anchor="middle" font-family="monospace" font-size="9" fill="#e8e8e8">Workshop</text>

  <circle cx="400" cy="400" r="28" fill="#0d2540" stroke="#3498db" stroke-width="1.5"/>
  <text x="400" y="405" text-anchor="middle" font-size="16">🍳</text>
  <text x="400" y="440" text-anchor="middle" font-family="monospace" font-size="9" fill="#e8e8e8">Galley</text>

  <circle cx="600" cy="400" r="28" fill="#0d2540" stroke="#3498db" stroke-width="1.5"/>
  <text x="600" y="405" text-anchor="middle" font-size="16">⚙️</text>
  <text x="600" y="440" text-anchor="middle" font-family="monospace" font-size="9" fill="#e8e8e8">Engine</text>

  <!-- Title -->
  <text x="400" y="475" text-anchor="middle" font-family="monospace" font-size="14" font-weight="bold" fill="#e8e8e8" opacity="0.7">12-ROOM TOPOLOGY</text>
</svg>
